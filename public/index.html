<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#241810" />
  <title>Find It at Home!</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/nunito-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/bowlby-one-sc-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- paper grain used by every paper surface -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
  </svg>
  <!-- original art for the game: 8 animal avatars and the interface icons (no emoji, so the only emojis are the 10 reactions) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ava-fox" viewBox="0 0 64 64">
      <path d="M9 8l17 14h12L55 8l-2 26c-1 13-10 22-21 22S12 47 11 34z" fill="#E07A2F"/>
      <path d="M13 13l8 7-7 5zM51 13l-8 7 7 5z" fill="#7A3A12"/>
      <path d="M15 33c6-3 11-2 17 4 6-6 11-7 17-4-1 11-8 19-17 19s-16-8-17-19z" fill="#FFF3E0"/>
      <circle cx="24" cy="31" r="3.2" fill="#2B1B12"/><circle cx="40" cy="31" r="3.2" fill="#2B1B12"/>
      <ellipse cx="32" cy="43" rx="3.6" ry="2.6" fill="#2B1B12"/>
    </symbol>
    <symbol id="ava-cat" viewBox="0 0 64 64">
      <path d="M12 10l14 12h12l14-12 1 20c2 4 3 8 3 11 0 10-10 17-24 17S8 51 8 41c0-3 1-7 3-11z" fill="#9AA3AD"/>
      <path d="M15 15l8 8-8 4zM49 15l-8 8 8 4z" fill="#F4B6C2"/>
      <ellipse cx="24" cy="36" rx="3.4" ry="4.2" fill="#2E7D4F"/><ellipse cx="40" cy="36" rx="3.4" ry="4.2" fill="#2E7D4F"/>
      <ellipse cx="24" cy="36" rx="1.2" ry="3" fill="#2B1B12"/><ellipse cx="40" cy="36" rx="1.2" ry="3" fill="#2B1B12"/>
      <path d="M29 44h6l-3 3z" fill="#E57A90"/>
      <path d="M6 42l14 2M6 48l14-1M58 42l-14 2M58 48l-14-1" stroke="#5C6670" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ava-dog" viewBox="0 0 64 64">
      <ellipse cx="32" cy="35" rx="20" ry="21" fill="#D9A066"/>
      <ellipse cx="12" cy="30" rx="7" ry="14" transform="rotate(18 12 30)" fill="#7A4A26"/>
      <ellipse cx="52" cy="30" rx="7" ry="14" transform="rotate(-18 52 30)" fill="#7A4A26"/>
      <ellipse cx="32" cy="45" rx="11" ry="8" fill="#F6E3C8"/>
      <circle cx="25" cy="32" r="3.2" fill="#2B1B12"/><circle cx="39" cy="32" r="3.2" fill="#2B1B12"/>
      <ellipse cx="32" cy="41" rx="4.4" ry="3.2" fill="#2B1B12"/>
      <path d="M29 49q3 5 6 0" fill="#E35D6A"/>
    </symbol>
    <symbol id="ava-bear" viewBox="0 0 64 64">
      <circle cx="15" cy="16" r="8" fill="#8B5A33"/><circle cx="49" cy="16" r="8" fill="#8B5A33"/>
      <circle cx="15" cy="16" r="4" fill="#D9A066"/><circle cx="49" cy="16" r="4" fill="#D9A066"/>
      <circle cx="32" cy="35" r="21" fill="#8B5A33"/>
      <ellipse cx="32" cy="43" rx="10" ry="8" fill="#D9A066"/>
      <circle cx="24" cy="31" r="3" fill="#2B1B12"/><circle cx="40" cy="31" r="3" fill="#2B1B12"/>
      <ellipse cx="32" cy="40" rx="4" ry="3" fill="#2B1B12"/>
      <path d="M28 46q4 3 8 0" stroke="#2B1B12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="ava-panda" viewBox="0 0 64 64">
      <circle cx="14" cy="15" r="8" fill="#2B1B12"/><circle cx="50" cy="15" r="8" fill="#2B1B12"/>
      <circle cx="32" cy="35" r="21" fill="#FBF8F1"/>
      <ellipse cx="23" cy="32" rx="6" ry="7.5" transform="rotate(-25 23 32)" fill="#2B1B12"/>
      <ellipse cx="41" cy="32" rx="6" ry="7.5" transform="rotate(25 41 32)" fill="#2B1B12"/>
      <circle cx="24" cy="31" r="2" fill="#FBF8F1"/><circle cx="40" cy="31" r="2" fill="#FBF8F1"/>
      <ellipse cx="32" cy="42" rx="3.6" ry="2.6" fill="#2B1B12"/>
      <path d="M28 47q4 3 8 0" stroke="#2B1B12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="ava-owl" viewBox="0 0 64 64">
      <path d="M12 12l10 8h20l10-8v30c0 10-9 16-20 16S12 52 12 42z" fill="#8A6A4F"/>
      <path d="M20 46c3-4 7-5 12-5s9 1 12 5c-2 6-7 9-12 9s-10-3-12-9z" fill="#D9C2A0"/>
      <circle cx="23" cy="31" r="8" fill="#FBF8F1"/><circle cx="41" cy="31" r="8" fill="#FBF8F1"/>
      <circle cx="23" cy="31" r="3.6" fill="#2B1B12"/><circle cx="41" cy="31" r="3.6" fill="#2B1B12"/>
      <path d="M29 38h6l-3 6z" fill="#E0A43A"/>
    </symbol>
    <symbol id="ava-frog" viewBox="0 0 64 64">
      <circle cx="19" cy="20" r="9" fill="#5FAE52"/><circle cx="45" cy="20" r="9" fill="#5FAE52"/>
      <ellipse cx="32" cy="38" rx="25" ry="18" fill="#5FAE52"/>
      <circle cx="19" cy="19" r="5.5" fill="#FBF8F1"/><circle cx="45" cy="19" r="5.5" fill="#FBF8F1"/>
      <circle cx="20" cy="20" r="2.6" fill="#2B1B12"/><circle cx="44" cy="20" r="2.6" fill="#2B1B12"/>
      <path d="M18 40q14 10 28 0" stroke="#2B5A27" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="15" cy="38" r="3" fill="#F4A6A0" opacity=".8"/><circle cx="49" cy="38" r="3" fill="#F4A6A0" opacity=".8"/>
    </symbol>
    <symbol id="ava-rabbit" viewBox="0 0 64 64">
      <ellipse cx="23" cy="15" rx="6" ry="15" fill="#E9E4DE"/><ellipse cx="41" cy="15" rx="6" ry="15" fill="#E9E4DE"/>
      <ellipse cx="23" cy="15" rx="2.8" ry="11" fill="#F4B6C2"/><ellipse cx="41" cy="15" rx="2.8" ry="11" fill="#F4B6C2"/>
      <circle cx="32" cy="40" r="19" fill="#E9E4DE"/>
      <circle cx="25" cy="37" r="3" fill="#2B1B12"/><circle cx="39" cy="37" r="3" fill="#2B1B12"/>
      <path d="M29 44h6l-3 3z" fill="#E57A90"/>
      <rect x="29.5" y="48" width="5" height="5" rx="1" fill="#FBF8F1" stroke="#C9BFB5"/>
    </symbol>
    <!-- interface icons: stroke drawings that take the colour of the text around them -->
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound-all" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sound-fx" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 9a2 2 0 1 1 3 1.7c-.7.4-1 .8-1 1.6M12 14.2v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 17h6M10 20h4M12 3a6 6 0 0 0-3.5 10.9c.4.3.5.7.5 1.1v2h6v-2c0-.4.1-.8.5-1.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor"/></symbol>
  </svg>
  <div class="desk" aria-hidden="true"></div>
  <main id="app"></main>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="assertive"></div>
  <script src="/fx.js"></script>
  <script src="/app.js"></script>
</body>
</html>
